name: EnvSusta temporary quality loop

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "59 15 24 8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: envsusta-temporary-audit-loop
  cancel-in-progress: true

jobs:
  audit-until-cutoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop at 23.59 WIB
        id: cutoff
        shell: bash
        run: |
          cutoff_epoch=$(date --date='2026-08-24T23:59:00+08:00' +%s)
          now_epoch=$(date +%s)
          if [ "$now_epoch" -ge "$cutoff_epoch" ]; then
            echo "reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "reached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retire temporary workflow
        if: steps.cutoff.outputs.reached == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/envsusta-audit-loop.yml
          git commit -m "chore: retire temporary EnvSusta audit loop"
          git push

      - name: Setup pnpm
        if: steps.cutoff.outputs.reached != 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.cutoff.outputs.reached != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.cutoff.outputs.reached != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and verify source
        if: steps.cutoff.outputs.reached != 'true'
        run: |
          pnpm format:check
          pnpm check
          VITE_DEPLOY_TARGET=github pnpm build

      - name: Audit public deployment
        if: steps.cutoff.outputs.reached != 'true'
        shell: bash
        run: |
          audit_url="https://claudesharing2-creator.github.io/ENVSUSTA/?audit=$(date +%s)"
          page=$(curl --fail --location --retry 3 --retry-delay 5 --silent --show-error "$audit_url")
          grep -q "EnvSusta" <<< "$page"
          grep -q "/ENVSUSTA/assets/" <<< "$page"
          echo "Audit lulus: source, build, dan shell publik EnvSusta tersedia."
